<div class="min-h-screen bg-bg-panel text-secondary">
  <!-- overlay موبایل -->
  <div
    class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm transition-opacity md:hidden"
    [class.pointer-events-none]="!menuOpen"
    [class.opacity-0]="!menuOpen"
    (click)="menuOpen = false"></div>

  <!-- سایدبار -->
  <aside
    class="fixed inset-y-0 right-0 z-50 flex w-72 flex-col bg-secondary text-white shadow-2xl transition-transform duration-300 ease-in-out md:translate-x-0"
    [class.translate-x-0]="menuOpen"
    [class.translate-x-full]="!menuOpen">

    <!-- لوگو -->
    <div class="relative overflow-hidden border-b border-white/10 px-6 py-6">
      <div class="absolute -left-8 -top-8 h-24 w-24 rounded-full bg-primary/30 blur-2xl"></div>
      <a routerLink="/" class="relative flex items-center gap-3">
        <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-primary to-primary-dark text-lg font-bold text-white shadow-lg shadow-primary/30">T</span>
        <span>
          <span class="block text-lg font-extrabold">تولیدی</span>
          <span class="block text-xs text-gold">{{ roleLabel }}</span>
        </span>
      </a>
      <div class="relative mt-4 h-0.5 w-full overflow-hidden rounded-full bg-white/10">
        <div class="h-full w-1/3 rounded-full bg-gradient-to-l from-gold to-transparent"></div>
      </div>
    </div>

    <!-- ناوبری -->
    <nav class="flex-1 space-y-1 overflow-y-auto px-4 py-4">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        (click)="menuOpen = false"
        class="group flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition-all"
        [ngClass]="{
          'bg-white/10 text-white': isActive(item.path),
          'text-white/60 hover:bg-white/5 hover:text-white': !isActive(item.path)
        }">
        <span
          class="flex h-9 w-9 items-center justify-center rounded-lg transition-colors"
          [ngClass]="{
            'bg-gradient-to-br from-primary to-primary-dark': isActive(item.path),
            'bg-white/5': !isActive(item.path)
          }">
          <svg [ngSwitch]="item.icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <ng-container *ngSwitchCase="'dashboard'"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/></ng-container>
            <ng-container *ngSwitchCase="'products'"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M3.3 8.3L12 13l8.7-4.7M12 13v9"/></ng-container>
            <ng-container *ngSwitchCase="'users'"><path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path stroke-linecap="round" stroke-linejoin="round" d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></ng-container>
            <ng-container *ngSwitchCase="'sellers'"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6"/></ng-container>
            <ng-container *ngSwitchCase="'discount'"><path stroke-linecap="round" stroke-linejoin="round" d="M20.6 13.4L11 3.8V2h-1.8L3 8.2v1.8l9.6 9.6a1 1 0 001.4 0l6.6-6.6a1 1 0 000-1.4z"/><circle cx="7.5" cy="7.5" r="0.5" fill="currentColor"/></ng-container>
            <ng-container *ngSwitchCase="'report'"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18"/><path stroke-linecap="round" stroke-linejoin="round" d="M8 17v-6M13 17V7M18 17v-9"/></ng-container>
            <ng-container *ngSwitchCase="'settings'"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></ng-container>
            <ng-container *ngSwitchCase="'orders'"><path stroke-linecap="round" stroke-linejoin="round" d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 10a4 4 0 01-8 0"/></ng-container>
            <ng-container *ngSwitchCase="'commission'"><path stroke-linecap="round" stroke-linejoin="round" d="M19 5L5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></ng-container>
            <ng-container *ngSwitchCase="'wallet'"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/><path stroke-linecap="round" stroke-linejoin="round" d="M16 12h5M16 12a2 2 0 100 4h5v-4h-5z"/></ng-container>
            <ng-container *ngSwitchCase="'education'"><path stroke-linecap="round" stroke-linejoin="round" d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path stroke-linecap="round" stroke-linejoin="round" d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></ng-container>
          </svg>
        </span>
        {{ item.label }}
        <span *ngIf="isActive(item.path)" class="mr-auto h-1.5 w-1.5 rounded-full bg-gold"></span>
      </a>
    </nav>

    <!-- خروج -->
    <div class="border-t border-white/10 p-4">
      <button type="button" (click)="logout()" class="flex w-full items-center justify-center gap-2 rounded-xl border border-red-300/30 px-4 py-2.5 text-sm font-medium text-red-200 transition-colors hover:bg-red-500/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        خروج از حساب
      </button>
    </div>
  </aside>

  <!-- محتوای اصلی -->
  <div class="md:mr-72">
    <!-- هدر -->
    <header class="sticky top-0 z-30 flex h-16 items-center justify-between gap-3 border-b border-black/5 bg-white/90 px-4 backdrop-blur md:px-8">
      <div class="flex items-center gap-3">
        <button type="button" (click)="menuOpen = !menuOpen" class="flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200 text-secondary transition-colors hover:bg-gray-50 md:hidden" aria-label="منو">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="text-lg font-bold">{{ isAdmin ? 'پنل مدیریت' : 'پنل فروشنده' }}</h1>
      </div>

      <div class="flex items-center gap-3">
        <span class="hidden rounded-full bg-gold/15 px-3 py-1 text-xs font-bold text-gold-dark sm:inline-block">{{ roleLabel }}</span>
        <div class="flex items-center gap-2">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-primary to-primary-dark text-sm font-bold text-white">{{ username.charAt(0) }}</span>
          <span class="hidden text-sm font-medium text-secondary sm:inline-block">{{ username }}</span>
        </div>
        <button type="button" (click)="logout()" class="rounded-xl border border-gray-200 px-3 py-1.5 text-sm text-gray-600 transition-colors hover:bg-gray-50 sm:hidden">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </header>

    <main class="p-4 md:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
