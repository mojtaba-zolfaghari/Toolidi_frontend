<mat-sidenav-container class="admin-shell" dir="rtl">
  <!-- سایدبار -->
  <mat-sidenav #sidenav mode="side" [opened]="menuOpen" class="admin-shell__sidenav"
    [mode]="isMobile ? 'over' : 'side'" (openedChange)="menuOpen = $event">

    <!-- لوگو -->
    <div class="admin-shell__brand">
      <a routerLink="/" class="admin-shell__brand-link">
        <span class="admin-shell__logo">T</span>
        <span>
          <span class="admin-shell__brand-name">تولیدی</span>
          <span class="admin-shell__brand-role">{{ roleLabel }}</span>
        </span>
      </a>
    </div>

    <!-- ناوبری گروهی -->
    <mat-nav-list class="admin-shell__nav">
      <ng-container *ngFor="let group of navGroups">
        <div *ngIf="group.label && group.items.length" class="admin-shell__group-label">{{ group.label }}</div>
        <a *ngFor="let item of group.items" mat-list-item [routerLink]="item.path"
          (click)="isMobile && sidenav.close()" [ngClass]="{ 'admin-shell__item--active': isActive(item.path) }">
          <mat-icon *ngIf="item.matIcon" matListItemIcon>{{ item.matIcon }}</mat-icon>
          <span *ngIf="!item.matIcon" matListItemIcon class="admin-shell__item-emoji" aria-hidden="true">{{ item.icon }}</span>
          <span matListItemTitle class="admin-shell__item-label">{{ item.label }}</span>
          <span *ngIf="item.badge && item.badge() > 0" matListItemMeta class="admin-shell__badge">{{ item.badge() }}</span>
        </a>
      </ng-container>
    </mat-nav-list>

    <!-- خروج -->
    <div class="admin-shell__footer">
      <button mat-stroked-button class="admin-shell__logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        خروج از حساب
      </button>
    </div>
  </mat-sidenav>

  <!-- محتوای اصلی -->
  <mat-sidenav-content class="admin-shell__content-wrap">
    <!-- هدر -->
    <mat-toolbar class="admin-shell__toolbar">
      <button mat-icon-button *ngIf="isMobile" (click)="sidenav.toggle()" aria-label="منو">
        <mat-icon>menu</mat-icon>
      </button>
      <h1 class="admin-shell__title">{{ isAdmin ? 'پنل مدیریت' : 'پنل ' + roleLoggedIn }}</h1>
      <span class="admin-shell__spacer"></span>
      <span class="admin-shell__role-chip">{{ roleLabel }}</span>
      <div class="admin-shell__user">
        <span class="admin-shell__avatar">{{ username.charAt(0) }}</span>
        <span class="admin-shell__username">{{ username }}</span>
      </div>
      <button mat-icon-button (click)="logout()" aria-label="خروج">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="admin-shell__main">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
