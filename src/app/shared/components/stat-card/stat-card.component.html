<mat-card appearance="outlined" class="stat-card" dir="rtl">
  <mat-card-content>
    <div class="stat-card__row">
      <div class="stat-card__text">
        <p class="stat-card__title">{{ title }}</p>
        <p class="stat-card__value">{{ value }}</p>
        @if (subtitle) {
          <p class="stat-card__subtitle">{{ subtitle }}</p>
        }
      </div>
      @if (icon) {
        <div class="stat-card__icon" [ngClass]="'stat-card__icon--' + color" aria-hidden="true">{{ icon }}</div>
      }
    </div>
    @if (trendValue) {
      <div class="stat-card__trend">
        <span class="stat-card__trend-chip" [ngClass]="'stat-card__trend-chip--' + trend">
          {{ trendIcon }} {{ trendValue }}
        </span>
      </div>
    }
  </mat-card-content>
</mat-card>
