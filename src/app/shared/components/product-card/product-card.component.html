<div class="group bg-white rounded-2xl overflow-hidden shadow-card hover:shadow-card-hover hover:scale-[1.02] transition-all duration-200 cursor-pointer" (click)="openDetail()">
  <!-- تصویر محصول (placeholder چون بک‌اند فعلاً تصویر ندارد) -->
  <div class="relative w-full h-44 bg-gradient-to-br from-primary-light to-primary flex items-center justify-center text-5xl overflow-hidden">
    <img *ngIf="product.images?.length" [src]="product.images![0].imageUrl" [alt]="product.name" class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110" />
    <span *ngIf="!product.images?.length" class="select-none">🛍️</span>
    <!-- دکمه افزودن سریع -->
    <button
      type="button"
      (click)="$event.stopPropagation(); addToCart()"
      aria-label="افزودن به سبد خرید"
      class="absolute bottom-3 left-3 flex h-10 w-10 items-center justify-center rounded-xl bg-white text-primary shadow-lg transition-all hover:bg-primary hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    </button>
  </div>

  <div class="p-4">
    <h3 class="font-bold text-secondary mb-1 truncate">{{ product.name }}</h3>

    <!-- امتیاز -->
    <div class="flex items-center gap-1 mb-2">
      <span
        *ngFor="let star of [1, 2, 3, 4, 5]"
        class="text-sm"
        [class.text-yellow-400]="star <= (product.ratingAverage ?? 0)"
        [class.text-gray-300]="star > (product.ratingAverage ?? 0)">★</span>
      <span class="text-xs text-gray-400 mr-1">({{ product.ratingCount }})</span>
    </div>

    <!-- قیمت -->
    <div class="flex items-center gap-2">
      <span class="text-primary font-bold text-lg">{{ product.unitPrice | number }} تومان</span>
      <span *ngIf="product.comparePrice" class="text-gray-400 line-through text-sm">
        {{ product.comparePrice | number }} تومان
      </span>
    </div>
  </div>
</div>
