<button
  mat-flat-button
  [class]="classes"
  [disabled]="disabled || loading"
  (click)="onClick()">
  @if (loading) {
    <span class="action-button__spinner" aria-hidden="true"></span>
  }
  @if (!loading && icon) {
    <span aria-hidden="true">{{ icon }}</span>
  }
  @if (!iconOnly && !loading) {
    <span>{{ label }}</span>
  }
</button>
