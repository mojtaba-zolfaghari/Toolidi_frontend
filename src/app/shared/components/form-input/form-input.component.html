<div class="form-input" dir="rtl">
  <mat-form-field
    class="form-input__field"
    [ngClass]="{ 'form-input__field--error': !!error }"
    appearance="outline"
    subscriptSizing="dynamic"
    [style.width.%]="100">
    <mat-label>{{ label }}@if (required) {
      <span class="form-input__req"> *</span>
    }</mat-label>

    @if (icon) {
      <span matTextPrefix class="form-input__icon" aria-hidden="true">{{ icon }}</span>
    }

    @if (type !== 'textarea' && type !== 'select') {
      <input
        matInput
        [type]="type"
        [placeholder]="placeholder"
        [value]="value"
        [disabled]="disabled"
        (input)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()" />
    }

    @if (type === 'textarea') {
      <textarea
        matInput
        [placeholder]="placeholder"
        [value]="value"
        [disabled]="disabled"
        [rows]="rows"
        (input)="onInput($event)"
        (focus)="onFocus()"
      (blur)="onBlur()"></textarea>
    }

    @if (type === 'select') {
      <select
        matNativeControl
        [value]="value"
        [disabled]="disabled"
        (change)="onInput($event)"
        (focus)="onFocus()"
        (blur)="onBlur()">
        <option value="" [disabled]="!!placeholder">{{ placeholder || 'انتخاب کنید' }}</option>
        @for (opt of options; track opt) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    }
  </mat-form-field>

  @if (error) {
    <p class="form-input__error"><span aria-hidden="true">⚠</span> {{ error }}</p>
  }
  @if (hint && !error) {
    <p class="form-input__hint">{{ hint }}</p>
  }
  <div class="form-input__subspace" aria-hidden="true"></div>
</div>
