<section dir="rtl" class="sv-page">

  <!-- Page Header -->
  <app-page-header
    title="تأیید مدارک فروشندگان"
    subtitle="بازبینی و تأیید/رد مدارک بارگذاری‌شده توسط فروشندگان"
    [actions]="headerActions">
  </app-page-header>

  <p *ngIf="errorMessage" class="admin-alert admin-alert--error">{{ errorMessage }}</p>

  <!-- Status filter -->
  <mat-card appearance="outlined" class="sv-card">
    <div class="sv-toolbar">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="sv-filter">
        <mat-label>فیلتر وضعیت</mat-label>
        <mat-select [(ngModel)]="statusFilter">
          <mat-option value="all">همه</mat-option>
          <mat-option value="pending">در انتظار بررسی</mat-option>
          <mat-option value="verified">تأیید شده</mat-option>
          <mat-option value="rejected">رد شده</mat-option>
          <mat-option value="none">بدون مدرک</mat-option>
        </mat-select>
      </mat-form-field>
      <span class="sv-count">{{ filteredData.length }} فروشنده</span>
    </div>

    <div *ngIf="loading" class="sv-loading">
      <mat-progress-spinner diameter="40" mode="indeterminate"></mat-progress-spinner>
    </div>

    <div *ngIf="!loading" class="sv-table-wrap">
      <table mat-table [dataSource]="filteredData" matSort class="sv-table mat-elevation-z0">

        <ng-container matColumnDef="companyName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>فروشگاه</th>
          <td mat-cell *matCellDef="let row" class="sv-cell-strong">{{ row.companyName }}</td>
        </ng-container>

        <ng-container matColumnDef="contactName">
          <th mat-header-cell *matHeaderCellDef>فروشنده</th>
          <td mat-cell *matCellDef="let row">
            {{ row.contactName }}
            <span class="sv-cell-sub">{{ row.contactPhone }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef>شهر</th>
          <td mat-cell *matCellDef="let row">{{ row.city || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="docStatus">
          <th mat-header-cell *matHeaderCellDef>وضعیت مدارک</th>
          <td mat-cell *matCellDef="let row">
            <span class="sv-status sv-status--{{ row.docStatus }}">{{ row.statusLabel }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>عملیات</th>
          <td mat-cell *matCellDef="let row">
            <button
              type="button"
              mat-stroked-button
              color="primary"
              [disabled]="busySellerId === row.id || row.docStatus === 'none'"
              (click)="openReview(row)">
              <mat-icon aria-hidden="true">fact_check</mat-icon>
              بازبینی
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="sv-row"></tr>

        <tr *matNoDataRow class="mat-mdc-row">
          <td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">
            <app-empty-state
              icon="📭"
              title="فروشنده‌ای یافت نشد"
              message="هیچ فروشنده‌ای با این فیلتر وضعیت وجود ندارد."></app-empty-state>
          </td>
        </tr>
      </table>

      <mat-paginator
        [pageSize]="10"
        [pageSizeOptions]="[10, 25, 50]"
        showFirstLastButtons></mat-paginator>
    </div>
  </mat-card>
</section>
