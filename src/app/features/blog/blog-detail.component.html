<section class="bg-warm min-h-screen py-10">
  <div class="container mx-auto px-4 max-w-3xl">
    <a routerLink="/blog" class="text-primary text-sm hover:underline">← بازگشت به وبلاگ</a>

    <app-spinner *ngIf="loading" label="در حال بارگذاری مطلب…"></app-spinner>
    <p *ngIf="!loading && errorMessage" class="bg-red-50 text-red-600 rounded-xl px-4 py-3 mt-6">{{ errorMessage }}</p>

    <article *ngIf="!loading && post" [@fadeIn] class="mt-6 bg-white rounded-2xl shadow-card overflow-hidden">
      <div class="h-64 sm:h-80 bg-gradient-to-br from-primary-light to-secondary">
        <img *ngIf="post.featuredImage" [src]="post.featuredImage" [alt]="post.title" class="h-full w-full object-cover" />
        <div *ngIf="!post.featuredImage" class="flex h-full w-full items-center justify-center text-7xl text-white/70">✦</div>
      </div>
      <div class="p-6 sm:p-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-secondary leading-10">{{ post.title }}</h1>
        <div class="mt-4 flex flex-wrap items-center gap-3 text-sm text-gray-500">
          <span>{{ post.publishedAt | date:'yyyy/MM/dd - HH:mm' }}</span>
          <span class="text-gray-300">|</span>
          <span>{{ post.authorId ? 'نویسنده' : 'تیم Toolidi' }}</span>
          <span class="text-gray-300">|</span>
          <span>{{ post.viewCount }} بازدید</span>
        </div>
        <div class="mt-6 leading-9 text-gray-700 blog-content" [innerHTML]="post.content"></div>
      </div>
    </article>
  </div>
</section>
