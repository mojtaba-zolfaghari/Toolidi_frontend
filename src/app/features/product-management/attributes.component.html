<div class="space-y-4">
  <div class="flex items-center justify-between">
    <p class="text-sm text-gray-500">ویژگی‌های محصول را تعریف کنید (مثلاً رنگ با مقادیر قرمز، آبی، سبز).</p>
    <button type="button" (click)="addGroup()" class="rounded-xl bg-secondary px-4 py-2 text-sm font-bold text-white transition-colors hover:bg-secondary-light">+ افزودن ویژگی</button>
  </div>

  @if (!attributes.length) {
    <p class="rounded-2xl bg-gray-50 py-8 text-center text-sm text-gray-400">هنوز ویژگی‌ای تعریف نشده است.</p>
  }

  @for (group of attributes; track group; let gi = $index) {
    <div class="rounded-2xl border border-gray-200 bg-white p-4">
      <div class="flex flex-wrap items-center gap-3">
        <label class="flex-1 min-w-40">
          <span class="mb-1 block text-xs font-medium text-gray-500">نام ویژگی (مثلاً رنگ، سایز)</span>
          <input
            type="text"
            [(ngModel)]="group.name"
            (ngModelChange)="onFieldChange()"
            name="attrName{{ gi }}"
            placeholder="رنگ"
            class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
        </label>
        <button type="button" (click)="removeGroup(gi)" class="mt-4 text-sm text-red-500 hover:underline">حذف ویژگی</button>
      </div>
      <div class="mt-4 space-y-2">
        @for (value of group.values; track value; let vi = $index) {
          <div class="flex items-center gap-2">
            <input
              type="text"
              [(ngModel)]="value.value"
              (ngModelChange)="onFieldChange()"
              name="attrValue{{ gi }}_{{ vi }}"
              placeholder="مقدار (مثلاً قرمز)"
              class="flex-1 rounded-xl border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
            <label class="flex cursor-pointer items-center gap-1 rounded-lg border border-gray-300 px-3 py-2 text-xs text-gray-600 transition-colors hover:bg-gray-50">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
              تصویر
              <input type="file" accept="image/*" class="hidden" (change)="onValueImage(gi, vi, $event)" />
            </label>
            @if (value.image) {
              <img [src]="value.image" class="h-9 w-9 rounded-lg object-cover" alt="نمونه" />
            }
            <button type="button" (click)="removeValue(gi, vi)" class="text-red-500 hover:underline">×</button>
          </div>
        }
        <button type="button" (click)="addValue(gi)" class="text-sm text-primary hover:underline">+ افزودن مقدار</button>
      </div>
    </div>
  }
</div>
