<div>
  <div
    (dragover)="$event.preventDefault(); isDragging = true"
    (dragleave)="isDragging = false"
    (drop)="onDrop($event)"
    class="cursor-pointer rounded-2xl border-2 border-dashed p-8 text-center transition-colors"
    [class.border-primary]="isDragging"
    [class.bg-bg-muted]="isDragging"
    [class.border-gray-300]="!isDragging">
    <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto mb-3 h-10 w-10 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
    <p class="mb-3 text-sm text-gray-500">تصاویر را اینجا رها کنید یا با کلیک انتخاب کنید</p>
    <label class="inline-block cursor-pointer rounded-xl bg-primary px-5 py-2 font-bold text-white transition-colors hover:bg-primary-dark">
      انتخاب تصاویر
      <input type="file" accept="image/*" multiple class="hidden" [disabled]="disabled" (change)="onFilesSelected($event)" />
    </label>
  </div>

  @if (images.length) {
    <div class="mt-4 grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
      @for (image of images; track image; let i = $index) {
        <div class="group relative overflow-hidden rounded-xl border border-gray-200">
          <img [src]="image.dataUrl" [alt]="image.altText" class="h-28 w-full object-cover" />
          <button
            type="button"
            (click)="setPrimary(i)"
            [title]="image.isPrimary ? 'تصویر اصلی' : 'انتخاب به عنوان اصلی'"
            class="absolute right-2 top-2 flex h-8 w-8 items-center justify-center rounded-lg bg-white/90 text-lg shadow transition-colors"
            [class.text-yellow-500]="image.isPrimary"
            [class.text-gray-400]="!image.isPrimary">
            ★
          </button>
          <button
            type="button"
            (click)="remove(i)"
            title="حذف تصویر"
            class="absolute left-2 top-2 flex h-8 w-8 items-center justify-center rounded-lg bg-white/90 text-lg text-red-500 shadow transition-colors hover:bg-red-500 hover:text-white">
            ×
          </button>
          @if (image.isPrimary) {
            <span class="absolute bottom-2 right-2 rounded bg-primary px-2 py-0.5 text-xs font-bold text-white">اصلی</span>
          }
        </div>
      }
    </div>
  }
</div>
