<div class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <p class="text-sm text-gray-500">تنوع‌ها را از ترکیب ویژگی‌ها تولید کنید و سپس جزئیات هر تنوع را ویرایش نمایید.</p>
    <button type="button" (click)="generate()" class="rounded-xl bg-primary px-4 py-2 text-sm font-bold text-white transition-colors hover:bg-primary-dark">تولید خودکار تنوع‌ها</button>
  </div>

  <p *ngIf="!variations.length" class="rounded-2xl bg-gray-50 py-8 text-center text-sm text-gray-400">
    تنوعی تولید نشده است. ابتدا ویژگی‌ها را تعریف و سپس دکمه «تولید خودکار» را بزنید.
  </p>

  <div *ngFor="let variation of variations; let i = index" class="rounded-2xl border border-gray-200 bg-white p-4">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <input
          type="radio"
          name="defaultVariation"
          [checked]="variation.isDefault"
          (change)="setDefault(i)"
          class="accent-primary"
          title="تنوع پیش‌فرض" />
        <strong class="text-secondary">{{ variation.displayName || 'بدون نام' }}</strong>
      </div>
      <button type="button" (click)="remove(i)" class="text-sm text-red-500 hover:underline">حذف</button>
    </div>

    <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4">
      <label class="col-span-2 sm:col-span-1">
        <span class="mb-1 block text-xs text-gray-500">کد تنوع (SKU)</span>
        <input type="text" [(ngModel)]="variation.sku" (ngModelChange)="onFieldChange()" name="varSku{{ i }}" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm" />
      </label>
      <label>
        <span class="mb-1 block text-xs text-gray-500">تغییر قیمت (تومان)</span>
        <input type="number" [(ngModel)]="variation.priceAdjustment" (ngModelChange)="onFieldChange()" name="varPrice{{ i }}" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm" />
      </label>
      <label>
        <span class="mb-1 block text-xs text-gray-500">موجودی</span>
        <input type="number" min="0" [(ngModel)]="variation.stockQuantity" (ngModelChange)="onFieldChange()" name="varStock{{ i }}" class="w-full rounded-xl border border-gray-300 px-3 py-2 text-sm" />
      </label>
    </div>
  </div>
</div>
