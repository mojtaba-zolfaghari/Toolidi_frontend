<section class="bg-warm min-h-screen py-10">
  <div class="container mx-auto px-4">
    <div *ngIf="loading" class="text-center text-gray-400 py-20">در حال بارگذاری…</div>

    <div *ngIf="errorMessage" class="text-center text-red-500 py-20">{{ errorMessage }}</div>

    <div *ngIf="product" class="grid grid-cols-1 md:grid-cols-2 gap-10">
      <!-- تصویر (placeholder چون بک‌اند فعلاً تصویر ندارد) -->
      <div class="bg-gradient-to-br from-primary-light to-primary rounded-2xl h-80 flex items-center justify-center text-8xl">
        🛍️
      </div>

      <!-- اطلاعات -->
      <div>
        <h1 class="text-3xl font-bold text-secondary mb-3">{{ product.name }}</h1>

        <div class="flex items-center gap-1 mb-4">
          <span
            *ngFor="let star of [1, 2, 3, 4, 5]"
            class="text-lg"
            [class.text-yellow-400]="star <= (product.ratingAverage ?? 0)"
            [class.text-gray-300]="star > (product.ratingAverage ?? 0)">★</span>
          <span class="text-sm text-gray-400 mr-2">({{ product.ratingCount }} نظر)</span>
        </div>

        <div class="flex items-center gap-3 mb-4">
          <span class="text-primary font-bold text-3xl">{{ product.unitPrice | number }} تومان</span>
          <span *ngIf="product.comparePrice" class="text-gray-400 line-through text-lg">
            {{ product.comparePrice | number }} تومان
          </span>
        </div>

        <p class="text-gray-600 mb-6 leading-relaxed">
          {{ product.fullDescription || product.shortDescription || 'توضیحاتی برای این محصول ثبت نشده است.' }}
        </p>

        <div class="flex items-center gap-4 mb-6">
          <span class="font-medium text-secondary">تعداد:</span>
          <div class="flex items-center gap-2">
            <button type="button" (click)="changeQuantity(1)" class="w-9 h-9 rounded-lg border border-gray-300 hover:bg-gray-50">+</button>
            <span class="w-12 text-center font-bold">{{ quantity }}</span>
            <button type="button" (click)="changeQuantity(-1)" class="w-9 h-9 rounded-lg border border-gray-300 hover:bg-gray-50">-</button>
          </div>
        </div>

        <button
          type="button"
          (click)="addToCart()"
          class="w-full md:w-auto bg-primary text-white font-bold rounded-xl px-8 py-3 hover:bg-primary-dark transition-colors">
          افزودن به سبد خرید
        </button>
      </div>
    </div>
  </div>
</section>
