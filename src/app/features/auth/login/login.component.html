<section class="login-shell" dir="rtl">
  <div class="login-shell__bg"></div>
  <div class="login-card">
    <div class="login-card__header">
      <a routerLink="/" class="login-brand" aria-label="بازگشت به خانه">
        <span class="login-brand__mark">ت</span>
        <span class="login-brand__name">تولیدی</span>
      </a>
      <h1 class="login-card__title">ورود به حساب کاربری</h1>
      <p class="login-card__subtitle">با کد ملی و رمز عبور وارد شوید</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="login-field">
        <mat-label>کد ملی</mat-label>
        <input matInput type="text" id="nationalCode" formControlName="nationalCode" placeholder="کد ملی خود را وارد کنید" autocomplete="off" />
        <mat-error>کد ملی الزامی است.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="login-field">
        <mat-label>رمز عبور</mat-label>
        <input matInput type="password" id="password" formControlName="password" placeholder="رمز عبور خود را وارد کنید" autocomplete="current-password" />
        <mat-error>رمز عبور باید حداقل ۶ کاراکتر باشد.</mat-error>
      </mat-form-field>

      <div *ngIf="errorMessage" class="login-alert login-alert--error">{{ errorMessage }}</div>

      <div class="login-options">
        <mat-checkbox formControlName="rememberMe">مرا به خاطر بسپار</mat-checkbox>
      </div>

      <button type="submit" mat-flat-button class="login-submit" [disabled]="form.invalid || loading">
        {{ loading ? 'در حال ورود…' : 'ورود' }}
      </button>
    </form>

    <div class="login-footer">
      <p class="login-footer__text">
        حساب کاربری ندارید؟
        <a routerLink="/register" class="login-footer__link">ثبت‌نام کنید</a>
      </p>
      <p class="login-footer__text login-footer__text--muted">فراموشی رمز عبور (به‌زودی)</p>
    </div>
  </div>
</section>
