<section class="bg-warm min-h-screen py-8 sm:py-10">
  <div class="container mx-auto px-4 max-w-5xl">
    <!-- Header -->
    <div class="text-center mb-8 sm:mb-10">
      <p class="text-sm text-primary font-medium mb-1">ارتباط با ما</p>
      <h1 class="text-2xl sm:text-3xl font-bold text-secondary">در کنار شما هستیم</h1>
      <p class="text-gray-500 mt-3">سوالی دارید یا به راهنمایی نیاز دارید؟ پیام بگذارید.</p>
    </div>

    <!-- Contact info cards (mobile: horizontal scroll, desktop: grid) -->
    <div class="flex gap-3 overflow-x-auto pb-4 mb-6 sm:mb-0 sm:grid sm:grid-cols-3 sm:overflow-visible sm:gap-6 sm:pb-0 lg:col-span-1">
      <div class="min-w-[200px] sm:min-w-0 bg-white rounded-2xl shadow-card p-5 shrink-0">
        <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-2xl bg-primary/10 text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>
        </div>
        <h2 class="font-bold text-secondary text-sm">ایمیل</h2>
        <p class="text-xs sm:text-sm text-gray-500 mt-1">support&#64;toolidi.ir</p>
      </div>
      <div class="min-w-[200px] sm:min-w-0 bg-white rounded-2xl shadow-card p-5 shrink-0">
        <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-2xl bg-primary/10 text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.79.67 2.65a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.43-1.24a2 2 0 0 1 2.11-.45c.86.33 1.75.55 2.65.67A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <h2 class="font-bold text-secondary text-sm">تلفن پشتیبانی</h2>
        <p class="text-xs sm:text-sm text-gray-500 mt-1" dir="ltr">۰۲۱ - ۰۰۰۰۰۰۰۰</p>
      </div>
      <div class="min-w-[200px] sm:min-w-0 bg-white rounded-2xl shadow-card p-5 shrink-0">
        <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-2xl bg-primary/10 text-primary">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <h2 class="font-bold text-secondary text-sm">آدرس</h2>
        <p class="text-xs sm:text-sm text-gray-500 mt-1">تهران، خیابان ولیعصر</p>
      </div>
    </div>

    <!-- Form -->
    <div class="mt-6 sm:mt-10">
      <form [formGroup]="form" (ngSubmit)="submit()" [@fadeIn]
            class="bg-white rounded-2xl shadow-card p-5 sm:p-6 space-y-4 sm:space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
          <label class="block">
            <span class="block text-secondary font-medium mb-1 text-sm">نام</span>
            <input formControlName="name" placeholder="نام شما"
                   class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
            <p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-red-500 text-xs mt-1">نام الزامی است.</p>
          </label>
          <label class="block">
            <span class="block text-secondary font-medium mb-1 text-sm">ایمیل</span>
            <input type="email" formControlName="email" placeholder="you@example.com"
                   class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary" />
            <p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500 text-xs mt-1">ایمیل معتبر وارد کنید.</p>
          </label>
        </div>
        <label class="block">
          <span class="block text-secondary font-medium mb-1 text-sm">پیام</span>
          <textarea rows="4" formControlName="message" placeholder="پیام خود را بنویسید…"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
          <p *ngIf="form.get('message')?.invalid && form.get('message')?.touched" class="text-red-500 text-xs mt-1">پیام باید حداقل ۱۰ کاراکتر باشد.</p>
        </label>
        <div *ngIf="submitted" class="bg-green-50 text-green-600 rounded-xl px-4 py-3 text-sm">پیام شما ثبت شد. به‌زودی با شما تماس می‌گیریم.</div>
        <button type="submit" [disabled]="form.invalid"
                class="w-full sm:w-auto bg-primary text-white rounded-xl px-8 py-3 font-bold hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          ارسال پیام
        </button>
      </form>
    </div>
  </div>
</section>
