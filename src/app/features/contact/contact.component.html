<section class="bg-warm min-h-screen py-10">
  <div class="container mx-auto px-4 max-w-5xl">
    <div class="text-center mb-10">
      <p class="text-sm text-primary font-medium mb-1">ارتباط با ما</p>
      <h1 class="text-3xl font-bold text-secondary">در کنار شما هستیم</h1>
      <p class="text-gray-500 mt-3">سوالی دارید یا به راهنمایی نیاز دارید؟ پیام بگذارید.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-1 space-y-4">
        <div class="bg-white rounded-2xl shadow-card p-6">
          <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-primary/10 text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M22 6l-10 7L2 6"/></svg>
          </div>
          <h2 class="font-bold text-secondary">ایمیل</h2>
          <p class="text-sm text-gray-500 mt-1">support&#64;toolidi.ir</p>
        </div>
        <div class="bg-white rounded-2xl shadow-card p-6">
          <div class="mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-primary/10 text-primary">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.79.67 2.65a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.43-1.24a2 2 0 0 1 2.11-.45c.86.33 1.75.55 2.65.67A2 2 0 0 1 22 16.92z"/></svg>
          </div>
          <h2 class="font-bold text-secondary">تلفن پشتیبانی</h2>
          <p class="text-sm text-gray-500 mt-1">۰۲۱ - ۰۰۰۰۰۰۰۰</p>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" [@fadeIn] class="lg:col-span-2 bg-white rounded-2xl shadow-card p-6 space-y-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="block"><span class="block text-secondary font-medium mb-1">نام</span><input formControlName="name" placeholder="نام شما" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary" /><p *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-red-500 text-sm mt-1">نام الزامی است.</p></label>
          <label class="block"><span class="block text-secondary font-medium mb-1">ایمیل</span><input type="email" formControlName="email" placeholder="you@example.com" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary" /><p *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500 text-sm mt-1">ایمیل معتبر وارد کنید.</p></label>
        </div>
        <label class="block"><span class="block text-secondary font-medium mb-1">پیام</span><textarea rows="5" formControlName="message" placeholder="پیام خود را بنویسید…" class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary"></textarea><p *ngIf="form.get('message')?.invalid && form.get('message')?.touched" class="text-red-500 text-sm mt-1">پیام باید حداقل ۱۰ کاراکتر باشد.</p></label>
        <div *ngIf="submitted" class="bg-green-50 text-green-600 rounded-xl px-4 py-3 text-sm">پیام شما ثبت شد. به‌زودی با شما تماس می‌گیریم.</div>
        <button type="submit" [disabled]="form.invalid" class="bg-primary text-white rounded-xl px-8 py-3 font-bold hover:bg-primary-dark transition-colors disabled:opacity-50 disabled:cursor-not-allowed">ارسال پیام</button>
      </form>
    </div>
  </div>
</section>
