# TASK-FE-CICD-FRONTEND-DEPLOY: CI/CD Pipeline for Frontend Deployment via FTP
# Triggers: push to main/dev branches
# Deploy to: ftp://192.236.168.180 (ftpuser / Aa@123456)
# Version: 2.6 - Test FTP connection first
name: CI/CD Frontend Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  FTP_REMOTE_DIR: /home/ftpuser/toolidi/

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npx ng build --configuration production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/toolidi/
          retention-days: 7

  deploy-frontend:
    name: FTP Deploy to Production
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./dist/toolidi/

      - name: Verify build output
        run: ls -la ./dist/toolidi/ | head -20

      - name: Set deployment version
        id: version
        run: |
          VERSION=$(git describe --tags --always --abbrev=7 2>/dev/null || echo "dev-${{ github.sha }}")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Test FTP connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Testing FTP connection..."
          echo "FTP Server: $FTP_SERVER"
          echo "FTP User: $FTP_USERNAME"
          
          # Test basic connection and login
          ftp_response=$(curl -s -v --ftp-port - -u "$FTP_USERNAME:$FTP_PASSWORD" ftp://$FTP_SERVER/ 2>&1 || true)
          echo "FTP Response: $ftp_response"
          
          # Try to list directory
          ftp_list=$(curl -s --ftp-port - -u "$FTP_USERNAME:$FTP_PASSWORD" ftp://$FTP_SERVER/ 2>&1 || true)
          echo "FTP List: $ftp_list"

      - name: Deploy via FTP (curl with active mode, ignore errors)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          LOCAL_DIR: ./dist/toolidi
          REMOTE_DIR: ${{ env.FTP_REMOTE_DIR }}
        run: |
          echo "🚀 Starting FTP deployment with curl (active mode)..."
          
          # Get local IP for active mode (GitHub Actions runner external IP)
          LOCAL_IP=$(curl -s https://api.ipify.org)
          echo "Local IP: $LOCAL_IP"
          
          # Get all files to upload
          cd ./dist/toolidi
          FILES=$(find . -type f | sed 's|^\./||')
          
          echo "Files to upload: $FILES"
          
          # Create remote directory structure and upload each file
          for file in $FILES; do
            remote_path="${{ env.FTP_REMOTE_DIR }}$file"
            remote_dir=$(dirname "$remote_path")
            
            echo "📤 Uploading: $file"
            
            # Use curl with active mode (--ftp-port) and create directories
            # Ignore curl errors to see if upload works anyway
            curl -s -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              --ftp-create-dirs \
              --ftp-port "$LOCAL_IP" \
              --upload-file "$file" \
              "ftp://${{ secrets.FTP_SERVER }}$remote_path" || echo "Curl failed but continuing..."
            
            echo "✅ Attempted upload: $file"
          done
          
          echo "✅ All files attempted upload!"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://toolidi.ir/)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Site is accessible"
          else
            echo "⚠️ Site returned $HTTP_CODE (may be old content if upload failed)"
          fi

      - name: Deployment notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *Deployment Complete* 🚀
            
            *Project:* Toolidi Frontend
            *Version:* ${{ steps.version.outputs.version }}
            *Branch:* ${{ github.ref }}
            *Commit:* ${{ github.sha }}
            *Deployed to:* https://toolidi.ir
            *Status:* ${{ job.status }}