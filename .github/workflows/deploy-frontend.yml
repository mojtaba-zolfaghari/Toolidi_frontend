# TASK-FE-CICD-FRONTEND-DEPLOY: CI/CD Pipeline for Frontend Deployment via FTP
# Triggers: push to main/dev branches
# Deploy to: ftp://192.236.168.180 (ftpuser / Aa@123456)
# Version: 2.7 - Using ncftp like before
name: CI/CD Frontend Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  FTP_REMOTE_DIR: /home/ftpuser/toolidi/

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npx ng build --configuration production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/toolidi/
          retention-days: 7

  deploy-frontend:
    name: FTP Deploy to Production
    runs-on: ubuntu-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./dist/toolidi/

      - name: Verify build output
        run: ls -la ./dist/toolidi/ | head -20

      - name: Set deployment version
        id: version
        run: |
          VERSION=$(git describe --tags --always --abbrev=7 2>/dev/null || echo "dev-${{ github.sha }}")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: 📂 Sync files with FTP using ncftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          LOCAL_DIR: ./dist/toolidi
          REMOTE_DIR: ${{ env.FTP_REMOTE_DIR }}
        run: |
          echo "🔧 Installing ncftp..."
          sudo apt-get update
          sudo apt-get install -y ncftp
          
          echo "📁 Creating ncftp configuration..."
          mkdir -p ~/.ncftp
          echo "host $FTP_SERVER" > ~/.ncftp/ncftpput.cfg
          echo "user $FTP_USERNAME" >> ~/.ncftp/ncftpput.cfg
          echo "pass $FTP_PASSWORD" >> ~/.ncftp/ncftpput.cfg
          
          echo "📂 Current directory contents:"
          ls -la ./dist/toolidi/
          
          echo "🚀 Uploading files to FTP server..."
          # Upload files using ncftpput with retry and timeout
          ncftpput -f ~/.ncftp/ncftpput.cfg -R -v -t 30 -T 30 "$REMOTE_DIR" "$LOCAL_DIR"/* || {
            echo "First attempt failed, retrying in 10 seconds..."
            sleep 10
            ncftpput -f ~/.ncftp/ncftpput.cfg -R -v -t 30 -T 30 "$REMOTE_DIR" "$LOCAL_DIR"/* || {
              echo "Second attempt failed, trying with passive mode..."
              # Try with passive mode
              ncftpput -f ~/.ncftp/ncftpput.cfg -R -v -t 30 -T 30 -o usePASV=true "$REMOTE_DIR" "$LOCAL_DIR"/* || {
                echo "All FTP attempts failed"
                exit 1
              }
            }
          }
          
          echo "✅ FTP upload completed successfully!"

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://toolidi.ir/)
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Site is accessible"
          else
            echo "⚠️ Site returned $HTTP_CODE"
          fi

      - name: Deployment notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *Deployment Complete* 🚀
            
            *Project:* Toolidi Frontend
            *Version:* ${{ steps.version.outputs.version }}
            *Branch:* ${{ github.ref }}
            *Commit:* ${{ github.sha }}
            *Deployed to:* https://toolidi.ir
            *Status:* ${{ job.status }}